version: 1
disable_existing_loggers: False
formatters:
  default:
    "()": uvicorn.logging.DefaultFormatter
    datefmt: "%Y-%m-%d %H:%M:%S"
    format: "[%(asctime)s +%(msecs)04d] [%(process)d] [%(levelname)s] %(message)s"
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
loggers:
  uvicorn.error:
    level: INFO
    handlers:
      - default
    propagate: no
  fastapi:
    level: INFO
    handlers:
      - default
