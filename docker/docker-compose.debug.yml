services:
  app:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.debug
      args:
        - APP_HOST=0.0.0.0
        - APP_PORT=5000
        - APP_WORKERS=1
        - APP_TIMEOUT=60
    ports:
      - 3401:5000
    volumes:
      - ../src:/src
    env_file:
      - ../.env
    depends_on:
      - postgres
    
  postgres:
    image: postgres
    platform: linux/amd64
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: ecommerce
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test_user", "-d", "ecommerce"]
      interval: 1s
      retries: 20
    ports:
      - 5432:5432
